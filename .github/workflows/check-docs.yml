name: Check documentation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:docs

  cli-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: whyour/qinglong
          ref: 70636900b29f1fcdabb736071e255dbb7e8bea0b
          path: upstream-qinglong
          persist-credentials: false
          sparse-checkout: cli/src/remote/api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-api-routes.mjs upstream-qinglong
